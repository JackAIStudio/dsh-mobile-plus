<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <title>手机远程</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --text: #1c2333;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-active: #1d4ed8;
      --primary-text: #ffffff;
      --icon-bg: #e0e7ff;
      --icon-color: #3b82f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --text: #e8eaed;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-active: #2563eb;
        --primary-text: #ffffff;
        --icon-bg: #1e293b;
        --icon-color: #60a5fa;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px) 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    main {
      width: 100%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: var(--icon-bg);
      color: var(--icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    p.desc {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .btn {
      appearance: none;
      border: none;
      outline: none;
      border-radius: 14px;
      height: 48px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.15s ease;
      width: 100%;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
    }
    .btn-primary:active {
      background: var(--primary-active);
    }
    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .spin {
      animation: rotate 1s linear infinite;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .status-hint {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3b82f6;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
        <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
      </svg>
    </div>
    <h1>手机远程</h1>
    <p class="desc">连不上正在运行的 DSH。<br>请确认电脑端已启动，网络恢复后会自动重连。</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="retryBtn">
        <svg id="refreshIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span id="btnText">重新连接</span>
      </button>
    </div>
    <div class="status-hint" id="statusHint">
      <span class="pulse-dot"></span>
      <span id="hintText">正在监听网络与后台唤醒…</span>
    </div>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('retryBtn');
      var btnText = document.getElementById('btnText');
      var refreshIcon = document.getElementById('refreshIcon');
      var hintText = document.getElementById('hintText');
      var isRetrying = false;
      var timer = null;

      function setRetrying(loading, msg) {
        isRetrying = loading;
        btn.disabled = loading;
        btnText.textContent = loading ? '正在连接…' : '重新连接';
        if (loading) {
          refreshIcon.classList.add('spin');
        } else {
          refreshIcon.classList.remove('spin');
        }
        if (msg) hintText.textContent = msg;
      }

      function tryReconnect(manual) {
        if (isRetrying && !manual) return;
        setRetrying(true, manual ? '正在尝试重新连接…' : '正在自动检测服务…');

        var controller = new AbortController();
        var timeoutId = setTimeout(function () {
          controller.abort();
        }, 3500);

        fetch('/mp/?_t=' + Date.now(), {
          method: 'HEAD',
          cache: 'no-store',
          signal: controller.signal
        }).then(function () {
          clearTimeout(timeoutId);
          hintText.textContent = '连接成功，正在载入…';
          if (!window.location.search.includes('no_redirect=1')) {
            window.location.replace('/mp/');
          }
        }).catch(function () {
          clearTimeout(timeoutId);
          setRetrying(false, '暂未连上，正在自动重试…');
        });
      }

      btn.addEventListener('click', function () {
        tryReconnect(true);
      });

      window.addEventListener('online', function () {
        tryReconnect(false);
      });

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          tryReconnect(false);
        }
      });
      window.addEventListener('pageshow', function () {
        tryReconnect(false);
      });
      window.addEventListener('focus', function () {
        tryReconnect(false);
      });

      timer = setInterval(function () {
        if (!isRetrying && document.visibilityState !== 'hidden') {
          tryReconnect(false);
        }
      }, 3500);
    })();
  </script>
</body>
</html>
